services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    # Só localhost — o Caddy é o único caminho de fora para esta porta.
    ports:
      - "127.0.0.1:3333:3333"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3333/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
