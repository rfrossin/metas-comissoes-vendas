name: Debug SSH connectivity
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: IP do runner
        run: curl -s https://api.ipify.org && echo

      - name: Ping (ICMP, pode nao responder mesmo assim)
        run: ping -c 3 -W 3 179.198.107.79 || true

      - name: TCP connect na porta 22 com timing
        run: |
          echo "tentando conexao TCP crua na porta 22..."
          time (timeout 15 bash -c 'cat < /dev/null > /dev/tcp/179.198.107.79/22' 2>&1) || echo "FALHOU/TIMEOUT"

      - name: TCP connect na porta 443 (controle)
        run: |
          time (timeout 15 bash -c 'cat < /dev/null > /dev/tcp/179.198.107.79/443' 2>&1) || echo "FALHOU/TIMEOUT"

      - name: traceroute ate a porta 22
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq traceroute
          traceroute -T -p 22 -m 20 -w 2 179.198.107.79 || true

      - name: nmap rapido na porta 22 (se disponivel)
        run: |
          sudo apt-get install -y -qq nmap
          sudo nmap -Pn -p 22 --reason 179.198.107.79 || true
