name: Deploy backend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # A chave é restrita via `command=` em authorized_keys no VPS —
          # sempre executa /opt/metas/deploy.sh (git pull + docker compose
          # up --build), independente do que for enviado aqui.
          script: echo "deploy triggered"
