name: Deploy backend

on:
  push:
    branches: [main]
  # Permite redisparar o deploy manualmente (aba Actions ou `gh workflow
  # run deploy.yml`) sem precisar de um commit vazio — útil quando o
  # deploy falha por algo do servidor, não do código.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # A chave é restrita via `command=` em authorized_keys no VPS —
          # sempre executa /opt/metas/deploy.sh (git pull + docker compose
          # up --build), independente do que for enviado aqui.
          script: echo "deploy triggered"
